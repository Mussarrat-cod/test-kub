openapi: 3.0.3
info:
  description: "Upload a log file, find which services are failing."
  title: Log Analyzer Service
  version: 1.0.0
servers:
- url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Service is up
      summary: Liveness check
      tags:
      - Health
  /analyze:
    post:
      description: Upload a log file (multipart/form-data) and get ERROR counts per
        service.
      operationId: analyze
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/analyze_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
          description: Analysis result
        "400":
          description: File is not valid UTF-8 text
        "422":
          description: Missing or invalid file field
      summary: Analyze a log file
      tags:
      - Analyze
components:
  schemas:
    HealthResponse:
      additionalProperties: false
      example:
        status: ok
      properties:
        status:
          example: ok
          title: status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    AnalysisResult:
      additionalProperties: false
      example:
        lines_processed: 5
        lines_skipped: 0
        errors_by_service:
          payment-service: 2
          billing-service: 1
          auth-service: 0
        top_offender: payment-service
      properties:
        lines_processed:
          example: 5
          title: lines_processed
          type: integer
        lines_skipped:
          example: 0
          title: lines_skipped
          type: integer
        errors_by_service:
          additionalProperties: false
          required: [primary, secondary]
          properties:
            primary:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
              example:
                order-service: 0
                payment-service: 2
            secondary:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
              example:
                auth-service: 1
                billing-service: 3
                notification-service: 0
          type: object
        top_offender:
          example: payment-service
          nullable: true
          title: top_offender
          type: string
        skipped_details:
          type: array
          description: Diagnostics for each skipped line (missing fields, extra fields, invalid tokens)
          items:
            type: object
            required: [line, content, error]
            properties:
              line:
                type: integer
                example: 3
              content:
                type: string
                example: "bad log line"
              error:
                type: string
                example: "Missing or invalid date field"
      required:
      - errors_by_service
      - lines_processed
      - lines_skipped
      - top_offender
      title: AnalysisResult
      type: object
    analyze_request:
      properties:
        file:
          description: A .log / .txt file
          format: binary
          type: string
      required:
      - file
      type: object