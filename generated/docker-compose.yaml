# version: '3.6'
services:
  service:
    build:
      # Context is genyal/ so the Dockerfile can access both generated/ and app/
      context: ..
      dockerfile: generated/Dockerfile
      target: service
    ports:
      - "8080:8080"
    command: uvicorn openapi_server.main:app --host 0.0.0.0 --port 8080
